  <g stroke="#C6EFEA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M136 50 V68 L142 74 V84" /><circle cx="136" cy="50" r="1.8" fill="#C6EFEA" /><circle cx="142" cy="84" r="1.8" fill="#C6EFEA" />
