      <circle cx="0" cy="-0.5" r="1.6" fill="#A83E16" /><circle cx="0" cy="-0.5" r="0.8" fill="#FFF4EB" />
    </g>
    <g transform="translate(58, 137) scale(0.68)">
      <path d="M0 -8 C1 -5 3 -3 6 -3 C3 0 1 2 0 6 C-1 2 -3 0 -6 -3 C-3 -3 -1 -5 0 -8 Z" fill="#FCEBD9" />
      <circle cx="0" cy="-0.5" r="1.6" fill="#A83E16" /><circle cx="0" cy="-0.5" r="0.8" fill="#FFF4EB" />
