  <path d="M100 44 C88 44 79 53 79 65 C79 79 100 99 100 99 C100 99 121 79 121 65 C121 53 112 44 100 44 Z" fill="#083835" stroke="#FFFFFF" stroke-width="0.8" />
  <circle cx="100" cy="63" r="7.5" fill="url(#copperPinGrad)" stroke="#5D2817" stroke-width="0.6" />
  <circle cx="98.5" cy="61.5" r="2" fill="#FFFFFF" opacity="0.4" />
